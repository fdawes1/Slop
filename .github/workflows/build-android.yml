name: Build Android APK

on:
  push:
    paths:
      - 'db_meter_android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        run: |
          cd db_meter_android
          npm ci

      - name: Sync web assets into Android project
        run: |
          cd db_meter_android
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x db_meter_android/android/gradlew

      - name: Build debug APK
        run: |
          cd db_meter_android/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noisewatch7-debug-${{ github.run_number }}
          path: db_meter_android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
