name: Build Leap CCTV Android APK

on:
  push:
    paths:
      - 'hidrive_cctv_monitoring/android/**'
      - '.github/workflows/build-cctv-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        run: |
          cd hidrive_cctv_monitoring/android
          npm ci

      - name: Write build config (build number + update token)
        run: |
          python3 -c "
          import os
          with open('hidrive_cctv_monitoring/android/www/build_config.js', 'w') as f:
              f.write('window.BUILD_NUMBER = {};\n'.format(os.environ['BUILD_NUMBER']))
              f.write('window.GH_TOKEN = \"{}\";\n'.format(os.environ['GH_TOKEN']))
              f.write('window.GH_REPO = \"fdawes1/slop\";\n')
          "
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}

      - name: Sync web assets into Android project
        run: |
          cd hidrive_cctv_monitoring/android
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x hidrive_cctv_monitoring/android/android/gradlew

      - name: Build debug APK
        run: |
          cd hidrive_cctv_monitoring/android/android
          ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: leap-cctv-debug-${{ github.run_number }}
          path: hidrive_cctv_monitoring/android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=hidrive_cctv_monitoring/android/android/app/build/outputs/apk/debug/app-debug.apk
          gh release delete cctv-android-latest --yes 2>/dev/null || true
          git push origin :refs/tags/cctv-android-latest 2>/dev/null || true
          gh release create cctv-android-latest \
            --title "Build ${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }} · $(git rev-parse --short HEAD)" \
            "$APK#leap-cctv.apk"
