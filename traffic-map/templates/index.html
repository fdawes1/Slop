<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Traffic Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', monospace; display: flex; height: 100vh; overflow: hidden; }

    #map { flex: 1; }

    #sidebar {
      width: 320px;
      background: #161b22;
      border-left: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #header {
      padding: 14px 16px;
      border-bottom: 1px solid #30363d;
      background: #0d1117;
    }
    #header h1 { font-size: 15px; font-weight: 600; color: #58a6ff; letter-spacing: 0.05em; }
    #header .subtitle { font-size: 11px; color: #8b949e; margin-top: 3px; }

    #stats {
      padding: 10px 16px;
      border-bottom: 1px solid #30363d;
      display: flex;
      gap: 16px;
      font-size: 12px;
    }
    .stat { display: flex; flex-direction: column; }
    .stat-val { font-size: 20px; font-weight: 700; color: #58a6ff; }
    .stat-label { color: #8b949e; font-size: 10px; margin-top: 1px; }

    #connection-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    #connection-list::-webkit-scrollbar { width: 4px; }
    #connection-list::-webkit-scrollbar-track { background: transparent; }
    #connection-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

    .conn-item {
      padding: 10px 16px;
      border-bottom: 1px solid #21262d;
      cursor: pointer;
      transition: background 0.15s;
    }
    .conn-item:hover { background: #1c2128; }
    .conn-item.active { background: #1c2128; border-left: 2px solid #58a6ff; }

    .conn-ip { font-size: 12px; font-weight: 600; color: #e6edf3; font-family: monospace; }
    .conn-location { font-size: 11px; color: #8b949e; margin-top: 2px; }
    .conn-isp { font-size: 10px; color: #6e7681; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conn-count {
      float: right;
      background: #21262d;
      color: #58a6ff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      margin-top: 1px;
    }

    #pulse {
      width: 8px; height: 8px; background: #3fb950; border-radius: 50%;
      display: inline-block; margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .leaflet-popup-content-wrapper {
      background: #161b22;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      font-size: 12px;
    }
    .leaflet-popup-tip { background: #161b22; }
    .popup-ip { font-size: 13px; font-weight: 700; color: #58a6ff; margin-bottom: 6px; font-family: monospace; }
    .popup-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 3px; }
    .popup-label { color: #8b949e; }
    .popup-val { color: #e6edf3; text-align: right; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="sidebar">
    <div id="header">
      <h1><span id="pulse"></span>Live Traffic Map</h1>
      <div class="subtitle" id="my-ip">Detecting location…</div>
    </div>
    <div id="stats">
      <div class="stat">
        <span class="stat-val" id="stat-hosts">0</span>
        <span class="stat-label">HOSTS</span>
      </div>
      <div class="stat">
        <span class="stat-val" id="stat-conns">0</span>
        <span class="stat-label">CONNECTIONS</span>
      </div>
      <div class="stat">
        <span class="stat-val" id="stat-countries">0</span>
        <span class="stat-label">COUNTRIES</span>
      </div>
    </div>
    <div id="connection-list"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      subdomains: 'abcd'
    }).addTo(map);

    const homeIcon = L.divIcon({
      html: '<div style="width:14px;height:14px;background:#3fb950;border:2px solid #fff;border-radius:50%;box-shadow:0 0 8px #3fb950;"></div>',
      iconSize: [14, 14], iconAnchor: [7, 7], className: ''
    });

    const remoteIcon = (count) => L.divIcon({
      html: `<div style="width:10px;height:10px;background:#f85149;border:1.5px solid #fff;border-radius:50%;box-shadow:0 0 6px #f85149;"></div>`,
      iconSize: [10, 10], iconAnchor: [5, 5], className: ''
    });

    let homeMarker = null;
    let remoteMarkers = {};
    let arcLayers = {};
    let myLat = 0, myLon = 0;
    let activeIp = null;

    function clearRemotes() {
      Object.values(remoteMarkers).forEach(m => map.removeLayer(m));
      Object.values(arcLayers).forEach(l => map.removeLayer(l));
      remoteMarkers = {};
      arcLayers = {};
    }

    function greatCirclePoints(lat1, lon1, lat2, lon2, n = 50) {
      const toRad = d => d * Math.PI / 180;
      const toDeg = r => r * 180 / Math.PI;
      const φ1 = toRad(lat1), λ1 = toRad(lon1);
      const φ2 = toRad(lat2), λ2 = toRad(lon2);
      const d = 2 * Math.asin(Math.sqrt(Math.sin((φ2-φ1)/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin((λ2-λ1)/2)**2));
      if (d < 0.001) return [[lat1, lon1], [lat2, lon2]];
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const f = i / n;
        const A = Math.sin((1-f)*d) / Math.sin(d);
        const B = Math.sin(f*d) / Math.sin(d);
        const x = A*Math.cos(φ1)*Math.cos(λ1) + B*Math.cos(φ2)*Math.cos(λ2);
        const y = A*Math.cos(φ1)*Math.sin(λ1) + B*Math.cos(φ2)*Math.sin(λ2);
        const z = A*Math.sin(φ1) + B*Math.sin(φ2);
        pts.push([toDeg(Math.atan2(z, Math.sqrt(x*x+y*y))), toDeg(Math.atan2(y, x))]);
      }
      return pts;
    }

    function popupHtml(c) {
      const conns = c.connections || [];
      const ports = [...new Set(conns.map(x => x.port))].slice(0, 6).join(', ');
      return `
        <div class="popup-ip">${c.ip}</div>
        <div class="popup-row"><span class="popup-label">Location</span><span class="popup-val">${c.city ? c.city + ', ' : ''}${c.country}</span></div>
        <div class="popup-row"><span class="popup-label">ISP</span><span class="popup-val">${c.isp || '—'}</span></div>
        <div class="popup-row"><span class="popup-label">Connections</span><span class="popup-val">${conns.length}</span></div>
        ${ports ? `<div class="popup-row"><span class="popup-label">Ports</span><span class="popup-val">${ports}</span></div>` : ''}
      `;
    }

    function render(data) {
      const { my_location, connections } = data;

      if (my_location && my_location.lat) {
        myLat = my_location.lat;
        myLon = my_location.lon;
        document.getElementById('my-ip').textContent =
          `${my_location.ip || ''} · ${my_location.city || ''}, ${my_location.country || ''}`;

        if (!homeMarker) {
          homeMarker = L.marker([myLat, myLon], { icon: homeIcon, zIndexOffset: 1000 })
            .addTo(map)
            .bindPopup('<b>Your machine</b>');
        } else {
          homeMarker.setLatLng([myLat, myLon]);
        }
      }

      const currentIps = new Set(connections.map(c => c.ip));

      // Remove stale
      Object.keys(remoteMarkers).forEach(ip => {
        if (!currentIps.has(ip)) {
          map.removeLayer(remoteMarkers[ip]);
          delete remoteMarkers[ip];
          if (arcLayers[ip]) { map.removeLayer(arcLayers[ip]); delete arcLayers[ip]; }
        }
      });

      let totalConns = 0;
      const countries = new Set();

      connections.forEach(c => {
        totalConns += (c.connections || []).length;
        if (c.country) countries.add(c.country);

        if (!remoteMarkers[c.ip]) {
          const m = L.marker([c.lat, c.lon], { icon: remoteIcon(c.connections.length) })
            .addTo(map)
            .bindPopup(popupHtml(c));
          m.on('click', () => highlightIp(c.ip));
          remoteMarkers[c.ip] = m;
        } else {
          remoteMarkers[c.ip].setPopupContent(popupHtml(c));
        }

        if (!arcLayers[c.ip] && myLat !== 0) {
          const pts = greatCirclePoints(myLat, myLon, c.lat, c.lon);
          const isActive = c.ip === activeIp;
          arcLayers[c.ip] = L.polyline(pts, {
            color: isActive ? '#58a6ff' : '#f8514966',
            weight: isActive ? 2 : 1,
            smoothFactor: 1
          }).addTo(map);
        }
      });

      // Stats
      document.getElementById('stat-hosts').textContent = connections.length;
      document.getElementById('stat-conns').textContent = totalConns;
      document.getElementById('stat-countries').textContent = countries.size;

      // Sidebar list
      const list = document.getElementById('connection-list');
      const scrollTop = list.scrollTop;
      list.innerHTML = '';
      connections
        .sort((a, b) => (b.connections || []).length - (a.connections || []).length)
        .forEach(c => {
          const div = document.createElement('div');
          div.className = 'conn-item' + (c.ip === activeIp ? ' active' : '');
          div.innerHTML = `
            <span class="conn-count">${(c.connections || []).length}</span>
            <div class="conn-ip">${c.ip}</div>
            <div class="conn-location">${c.city ? c.city + ', ' : ''}${c.country}</div>
            <div class="conn-isp">${c.isp || ''}</div>
          `;
          div.onclick = () => highlightIp(c.ip);
          list.appendChild(div);
        });
      list.scrollTop = scrollTop;
    }

    function highlightIp(ip) {
      activeIp = ip;
      Object.entries(arcLayers).forEach(([k, l]) => {
        l.setStyle({ color: k === ip ? '#58a6ff' : '#f8514966', weight: k === ip ? 2.5 : 1 });
        if (k === ip) l.bringToFront();
      });
      if (remoteMarkers[ip]) {
        remoteMarkers[ip].openPopup();
        map.panTo(remoteMarkers[ip].getLatLng(), { animate: true });
      }
      document.querySelectorAll('.conn-item').forEach((el, i) => {
        const ipEl = el.querySelector('.conn-ip');
        if (ipEl) el.classList.toggle('active', ipEl.textContent === ip);
      });
    }

    async function refresh() {
      try {
        const res = await fetch('/api/connections');
        const data = await res.json();
        render(data);
      } catch (e) {
        console.error('Fetch error', e);
      }
    }

    refresh();
    setInterval(refresh, 4000);
  </script>
</body>
</html>
