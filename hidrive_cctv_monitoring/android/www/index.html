<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Leap CCTV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #111117;
      font-family: system-ui, sans-serif;
      padding: 2rem;
    }

    .card {
      background: #1a1a24;
      border: 1px solid #26263a;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%; max-width: 360px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.7);
    }

    .logo {
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 1.6rem;
    }
    .logo-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: linear-gradient(135deg, #4652A3 0%, #52C6DA 100%);
      flex-shrink: 0;
    }
    .logo span {
      font-weight: 800; font-size: 1rem;
      color: #6472c8; letter-spacing: 0.02em;
    }

    h2 { font-size: 1.3rem; font-weight: 700; color: #e8e8f0; margin-bottom: 0.4rem; }
    p  { font-size: 0.85rem; color: #4a4a60; margin-bottom: 1.5rem; line-height: 1.5; }

    label {
      display: block; font-size: 0.7rem; font-weight: 700;
      color: #4a4a60; text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%; padding: 0.75rem 1rem;
      background: #111117; border: 2px solid #26263a;
      border-radius: 10px; color: #e8e8f0;
      font-size: 0.95rem; margin-bottom: 1rem; outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #6472c8; }

    button {
      width: 100%; padding: 0.8rem;
      background: #4652A3; color: #fff; border: none;
      border-radius: 10px; font-size: 0.95rem; font-weight: 800;
      cursor: pointer; transition: background 0.2s, transform 0.1s;
    }
    button:hover  { background: #3a4590; }
    button:active { transform: scale(0.97); }

    .error {
      margin-top: 0.8rem; padding: 0.5rem 0.75rem;
      background: rgba(220,38,38,0.1); border: 1px solid rgba(220,38,38,0.25);
      border-radius: 10px; font-size: 0.8rem; color: #f87171;
      display: none;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-dot"></div>
    <span>Leap CCTV</span>
  </div>
  <h2>Connect to server</h2>
  <p>Enter the address of the Leap CCTV server running on your network.</p>

  <label for="url-input">Server URL</label>
  <input id="url-input" type="url" placeholder="http://192.168.1.x:5000" autocomplete="url">
  <button onclick="connect()">Connect</button>
  <div class="error" id="error">Please enter a valid server URL.</div>
</div>

<script>
  const input = document.getElementById('url-input');
  const err   = document.getElementById('error');

  // Pre-fill last-used URL
  const saved = localStorage.getItem('cctv_server_url');
  if (saved) input.value = saved;

  input.addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });

  function connect() {
    const raw = input.value.trim();
    if (!raw) { err.style.display = 'block'; return; }

    let url;
    try {
      url = new URL(raw.startsWith('http') ? raw : 'http://' + raw);
    } catch {
      err.style.display = 'block'; return;
    }

    err.style.display = 'none';
    localStorage.setItem('cctv_server_url', url.href);
    window.location.href = url.href;
  }
</script>
</body>
</html>
