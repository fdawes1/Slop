server {
    listen 80;

    # Serve the web viewer
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Proxy web_video_server — disable buffering so MJPEG frames flow immediately
    location ~ ^/(stream|snapshot|web_video_server) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 5s;
        # Allow many concurrent MJPEG streams
        proxy_max_temp_file_size 0;
    }
}
