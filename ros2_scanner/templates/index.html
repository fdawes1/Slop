<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROS2 Robot Scanner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --dark:#0f1117; --dark2:#161b22; --dark3:#21262d;
      --accent:#e94560; --border:#30363d; --muted:#8b949e;
      --text:#c9d1d9; --text-dim:#484f58;
      --smsg:#7ee787; --bg:#f6f8fa;
    }
    /* ── Light mode overrides ── */
    [data-theme="light"] {
      --dark:#ffffff; --dark2:#f6f8fa; --dark3:#eef0f2;
      --border:#d0d7de; --muted:#656d76;
      --text:#24292f; --text-dim:#818b98;
      --smsg:#0a6640; --bg:#f6f8fa;
    }
    [data-theme="light"] body { background:#f0f2f5; }
    [data-theme="light"] .topbar input { background:#fff; color:#24292f; border-color:#d0d7de; }
    [data-theme="light"] .topbar input::placeholder { color:#818b98; }
    [data-theme="light"] #saved-select { background:#fff; color:#57606a; border-color:#d0d7de; }
    [data-theme="light"] .container-card { color:#24292f; }
    [data-theme="light"] .container-card:hover { background:#ddf4ff; border-color:#0969da; }
    [data-theme="light"] .container-card.selected { background:#dafbe1; border-color:#1a7f37; }
    [data-theme="light"] .sitem { color:#57606a; }
    [data-theme="light"] .sitem:hover { background:#eef0f2; color:#24292f; }
    [data-theme="light"] .sitem.active { background:#eef0f2; color:#24292f; }
    [data-theme="light"] .sitem-check { color:#818b98; }
    [data-theme="light"] .sitem-check.is-streaming { color:#1a7f37; }
    [data-theme="light"] .sitem-check.is-checked { color:#0969da; }
    [data-theme="light"] .stream-chip { color:#24292f; }
    [data-theme="light"] .chip-x { color:#818b98; }
    [data-theme="light"] .series-name { color:#24292f; }
    [data-theme="light"] .series-row:hover { background:#eef0f2; }
    [data-theme="light"] .smsg { color:var(--smsg); }
    [data-theme="light"] .emsg { color:#24292f; }
    [data-theme="light"] .output-placeholder { color:#818b98; }
    [data-theme="light"] .ovt-btn { color:#57606a; border-color:#d0d7de; }
    [data-theme="light"] .ovt-btn.active { background:#eef0f2; color:#24292f; border-color:#818b98; }
    [data-theme="light"] .hdr-btn { color:#57606a; border-color:#d0d7de; }
    [data-theme="light"] .hdr-btn:hover { color:#24292f; border-color:#818b98; }
    [data-theme="light"] .sg-btn { color:#57606a; border-color:#d0d7de; }
    [data-theme="light"] .sg-btn:hover { color:#24292f; }
    [data-theme="light"] #output-cnt { color:#818b98; }
    [data-theme="light"] #theme-btn { color:#656d76; border-color:#d0d7de; }
    [data-theme="light"] .cbar-toggle { color:#656d76; }
    [data-theme="light"] .detail-sep { background:#f6f8fa; border-color:#d0d7de; color:#818b98; }
    [data-theme="light"] .detail-sep:hover { background:#eef0f2; color:#24292f; }
    html,body{height:100%;margin:0;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);}

    /* ── Topbar ── */
    .topbar{background:var(--dark);border-bottom:1px solid var(--border);padding:0 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;height:50px;}
    .brand{font-weight:700;font-size:1rem;color:var(--accent);white-space:nowrap;margin-right:4px;}
    .topbar input{background:var(--dark2);border:1px solid var(--border);color:#c9d1d9;border-radius:6px;padding:3px 9px;font-size:.81rem;height:30px;}
    .topbar input::placeholder{color:#484f58;}
    .topbar input:focus{outline:none;border-color:#388bfd;box-shadow:0 0 0 3px rgba(56,139,253,.2);}
    .divider{width:1px;height:24px;background:var(--border);margin:0 3px;flex-shrink:0;}
    #saved-select{background:var(--dark2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 6px;font-size:.78rem;height:30px;max-width:130px;}

    /* ── Container bar ── */
    .cbar{background:var(--dark2);border-bottom:1px solid var(--border);padding:0 14px;display:none;flex-direction:column;flex-shrink:0;}
    .cbar.visible{display:flex;}
    .cbar-header{display:flex;align-items:center;gap:8px;min-height:36px;flex-shrink:0;}
    .cbar-label{font-size:.78rem;color:var(--muted);white-space:nowrap;}
    .cbar-selected-name{font-family:monospace;font-size:.78rem;color:#3fb950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
    .cbar-toggle{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 6px;font-size:.82rem;margin-left:auto;}
    .cbar-toggle:hover{color:#c9d1d9;}
    .cbar-toggle-icon{transition:transform .2s;display:inline-block;}
    .cbar.collapsed .cbar-toggle-icon{transform:rotate(180deg);}
    .cbar-body{display:flex;align-items:flex-start;gap:10px;padding-bottom:7px;flex-wrap:wrap;}
    .cbar.collapsed .cbar-body{display:none;}
    .cbar-controls{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0;}
    .container-card{display:flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--border);border-radius:6px;padding:4px 12px;background:var(--dark3);color:#c9d1d9;font-size:.8rem;transition:border-color .15s,background .15s;}
    .container-card:hover{border-color:#388bfd;background:#1c2a3d;}
    .container-card.selected{border-color:#3fb950;background:#0d2117;}
    .container-card .cname{font-family:monospace;font-weight:600;}
    .container-card .cimage{color:var(--muted);font-size:.72rem;}
    .ros-pill{font-size:.7rem;padding:1px 6px;border-radius:10px;font-weight:600;background:#1c3a2a;color:#3fb950;border:1px solid #2d6a40;}
    .zenoh-pill{font-size:.7rem;padding:1px 6px;border-radius:10px;background:#1a1a3e;color:#818cf8;border:1px solid #3730a3;}
    .no-ros{color:var(--muted);opacity:.6;}

    /* ── Status ── */
    .dot{width:9px;height:9px;border-radius:50%;background:#da3633;flex-shrink:0;transition:background .3s;}
    .dot.ssh{background:#e6a817;}
    .dot.ok{background:#3fb950;animation:blink 2.5s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
    #status-text{font-size:.78rem;color:var(--muted);white-space:nowrap;}

    /* ── Shell ── */
    .shell{display:flex;flex-direction:row;overflow:hidden;}

    /* ── Sidebar ── */
    .sidebar{width:290px;min-width:290px;background:var(--dark);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
    .stabs{display:flex;border-bottom:1px solid var(--border);}
    .stab{flex:1;padding:9px 4px;text-align:center;font-size:.74rem;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
    .stab:hover{color:#c9d1d9;}
    .stab.active{color:var(--accent);border-bottom-color:var(--accent);}
    .stab .badge{font-size:.64rem;background:var(--dark3);color:var(--muted);border-radius:10px;padding:1px 5px;margin-left:3px;}
    .sfilter{padding:8px;border-bottom:1px solid var(--border);}
    .sfilter input{width:100%;background:var(--dark2);border:1px solid var(--border);color:#c9d1d9;border-radius:5px;padding:4px 8px;font-size:.78rem;}
    .sfilter input::placeholder{color:#484f58;}
    .slist{flex:1;overflow-y:auto;}
    .slist::-webkit-scrollbar{width:4px;}
    .slist::-webkit-scrollbar-thumb{background:var(--dark3);border-radius:2px;}
    .sfooter{padding:7px 8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px;}

    /* Topic list items with checkbox */
    .sitem{display:flex;align-items:center;cursor:pointer;border-left:3px solid transparent;color:#8b949e;transition:background .1s,color .1s;}
    .sitem:hover{background:var(--dark2);color:#c9d1d9;}
    .sitem.active{background:var(--dark2);border-left-color:var(--accent);color:#fff;}
    .sitem-check{width:24px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.75rem;color:#484f58;transition:color .1s;}
    .sitem-check:hover{color:#58a6ff;}
    .sitem-check.is-streaming{color:#3fb950;}
    .sitem-check.is-checked{color:#58a6ff;}
    .sitem-label{flex:1;padding:6px 8px 6px 0;font-size:.77rem;font-family:"Courier New",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    /* Non-topic items (services/actions) keep original style */
    .sitem-plain{padding:6px 12px;font-size:.77rem;font-family:"Courier New",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    /* ── Detail pane ── */
    .detail{flex:1;overflow-y:auto;padding:20px 24px;min-width:0;}
    .detail.hidden{display:none;}

    /* ── Detail/output separator ── */
    .detail-sep{width:14px;flex-shrink:0;background:var(--dark2);border-left:1px solid var(--border);border-right:1px solid var(--border);display:none;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);transition:background .15s,color .15s;user-select:none;}
    .detail-sep:hover{background:var(--dark3);color:#c9d1d9;}
    .detail-sep.visible{display:flex;}

    /* ── Output panel (right side) ── */
    .output-panel{display:none;flex-direction:column;background:var(--dark);border-left:2px solid var(--border);flex-shrink:0;width:520px;position:relative;min-width:260px;}
    .output-panel.visible{display:flex;}
    .output-resize-handle{position:absolute;left:-4px;top:0;bottom:0;width:8px;z-index:10;cursor:ew-resize;}
    .output-resize-handle::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:3px;height:44px;border-radius:2px;background:#484f58;transition:background .15s;}
    .output-resize-handle:hover::after{background:var(--accent);}

    /* Output header */
    .output-hdr{padding:5px 10px 5px 14px;background:var(--dark2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-shrink:0;min-height:34px;}
    .output-hdr-left{display:flex;align-items:center;gap:5px;flex:1;min-width:0;overflow:hidden;}
    .output-hdr-right{display:flex;align-items:center;gap:3px;flex-shrink:0;}
    .stream-chips{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;align-items:center;flex:1;min-width:0;}
    .stream-chips::-webkit-scrollbar{height:3px;}
    .stream-chips::-webkit-scrollbar-thumb{background:var(--dark3);}
    .stream-chip{display:inline-flex;align-items:center;gap:3px;padding:1px 5px 1px 6px;border-radius:4px;border:1px solid var(--border);font-size:.7rem;color:#c9d1d9;background:var(--dark3);white-space:nowrap;flex-shrink:0;}
    .chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
    .chip-x{cursor:pointer;color:var(--muted);padding:0 2px;font-size:.9rem;line-height:1;transition:color .1s;}
    .chip-x:hover{color:#f85149;}
    #output-cnt{color:#484f58;font-size:.7rem;white-space:nowrap;flex-shrink:0;}

    /* View toggle */
    .ovt-wrap{display:none;gap:3px;align-items:center;flex-shrink:0;}
    .ovt-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:1px 9px;font-size:.71rem;border-radius:4px;cursor:pointer;transition:all .15s;}
    .ovt-btn.active{background:var(--dark3);color:#c9d1d9;border-color:#484f58;}
    .ovt-btn:hover:not(.active){color:#c9d1d9;border-color:#484f58;}

    /* Output body (text) */
    .output-body{flex:1;overflow-y:auto;padding:8px 12px;}
    .output-body::-webkit-scrollbar{width:4px;}
    .output-body::-webkit-scrollbar-thumb{background:var(--dark3);}
    .output-placeholder{height:100%;display:flex;align-items:center;justify-content:center;gap:10px;color:#484f58;font-size:.79rem;flex-direction:column;}
    .smsg{border-bottom:1px solid var(--dark3);padding:2px 0 4px;font-size:.73rem;font-family:monospace;white-space:pre-wrap;word-break:break-all;color:#7ee787;}
    .emsg{color:#c9d1d9;font-size:.74rem;font-family:monospace;white-space:pre-wrap;word-break:break-all;padding:4px 0;}

    /* ── Graph view ── */
    .output-graph-wrap{display:none;flex:1;flex-direction:row;min-height:0;overflow:hidden;}

    /* Series panel (left side of graph view) */
    .series-panel{width:200px;min-width:160px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--dark2);}
    .series-panel-hdr{padding:5px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .series-panel-title{font-size:.72rem;color:var(--muted);font-weight:600;letter-spacing:.04em;}
    .series-panel-body{flex:1;overflow-y:auto;}
    .series-panel-body::-webkit-scrollbar{width:3px;}
    .series-panel-body::-webkit-scrollbar-thumb{background:var(--dark3);}

    .series-group{border-bottom:1px solid var(--border);}
    .series-group-hdr{padding:4px 8px 4px 6px;background:var(--dark3);display:flex;align-items:center;gap:4px;position:sticky;top:0;z-index:1;}
    .series-group-topic{flex:1;font-size:.69rem;font-family:monospace;color:#818cf8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .series-group-btns{display:flex;gap:2px;flex-shrink:0;}
    .sg-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:.62rem;padding:0 4px;border-radius:3px;cursor:pointer;line-height:16px;}
    .sg-btn:hover{color:#c9d1d9;border-color:#484f58;}

    .series-row{display:flex;align-items:center;gap:5px;padding:3px 6px 3px 8px;cursor:pointer;transition:background .1s;border-bottom:1px solid #0d1117;}
    .series-row:hover{background:var(--dark3);}
    .series-row.faded{opacity:.35;}
    .series-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .series-name{flex:1;font-size:.71rem;font-family:monospace;color:#c9d1d9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .series-val{font-size:.68rem;font-family:monospace;color:#8b949e;text-align:right;min-width:52px;flex-shrink:0;}

    /* Canvas */
    .graph-canvas-wrap{flex:1;min-height:0;min-width:0;padding:6px 8px 2px;position:relative;overflow:hidden;}
    .graph-canvas-wrap canvas{position:absolute;inset:6px 8px 2px;width:calc(100% - 16px)!important;height:calc(100% - 8px)!important;}

    /* ── Cards ── */
    .icard{background:#fff;border:1px solid #d0d7de;border-radius:8px;margin-bottom:16px;overflow:hidden;}
    .icard-hdr{background:#f6f8fa;border-bottom:1px solid #d0d7de;padding:9px 16px;font-weight:600;font-size:.84rem;color:#24292f;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
    .icard-hdr:hover{background:#eef0f2;}
    .icard-hdr-left{display:flex;align-items:center;gap:6px;}
    .icard-chevron{color:#6e7781;font-size:.75rem;transition:transform .18s;flex-shrink:0;}
    .icard.collapsed .icard-chevron{transform:rotate(180deg);}
    .icard.collapsed .icard-body{display:none;}
    .icard.collapsed{border-bottom:none;}
    .icard-body{padding:16px;}
    .type-pill{font-family:monospace;font-size:.81rem;background:#ddf4ff;color:#0550ae;padding:2px 8px;border-radius:12px;border:1px solid #b6e3ff;}
    .code-block{background:#0d1117;color:#c9d1d9;border-radius:6px;padding:12px;font-family:monospace;font-size:.77rem;white-space:pre-wrap;max-height:280px;overflow-y:auto;}
    .code-block::-webkit-scrollbar{width:4px;}
    .code-block::-webkit-scrollbar-thumb{background:var(--dark3);}
    .info-row{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;font-size:.84rem;}
    .info-label{color:#57606a;min-width:130px;}
    .empty{text-align:center;padding:80px 20px;color:#57606a;}
    .empty i{font-size:3rem;display:block;margin-bottom:12px;opacity:.5;}

    /* ── Danger mode ── */
    #danger-btn {
      background:#21262d; border:1px solid var(--border); color:var(--muted);
      padding:2px 10px; border-radius:6px; cursor:pointer; font-size:.8rem;
      height:30px; font-weight:600; transition:all .2s; white-space:nowrap;
    }
    #danger-btn:hover { border-color:#da3633; color:#da3633; }
    #danger-btn.armed {
      background:#da3633; border-color:#da3633; color:#fff;
      animation:danger-pulse 1.8s ease-in-out infinite;
    }
    @keyframes danger-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(218,54,51,.5)} 50%{box-shadow:0 0 0 6px rgba(218,54,51,0)} }
    .confirm-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:9999;
      display:none; align-items:center; justify-content:center;
    }
    .confirm-dialog {
      background:#161b22; border:2px solid #da3633; border-radius:10px;
      padding:24px 28px; max-width:500px; width:90%; box-shadow:0 8px 32px rgba(0,0,0,.6);
    }
    .confirm-title { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .confirm-pre {
      background:#0d1117; color:#7ee787; border-radius:6px; padding:10px 12px;
      font-size:.77rem; margin:10px 0 18px; max-height:180px; overflow-y:auto;
      white-space:pre-wrap; word-break:break-all; font-family:monospace;
      border:1px solid #30363d;
    }
    [data-theme="light"] .confirm-dialog { background:#ffffff; border-color:#da3633; }
    [data-theme="light"] .confirm-pre { background:#f6f8fa; color:#0a6640; border-color:#d0d7de; }

    /* ── Misc ── */
    .spin{display:inline-block;width:13px;height:13px;border:2px solid #dee2e6;border-top-color:#6c757d;border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
    textarea.form-control{font-family:monospace;font-size:.81rem;}
    .hdr-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:1px 7px;font-size:.72rem;border-radius:4px;cursor:pointer;transition:all .15s;white-space:nowrap;}
    .hdr-btn:hover{color:#c9d1d9;border-color:#484f58;}
  </style>
</head>
<body>

<!-- ── Topbar ─────────────────────────────────────────────────────────────── -->
<div class="topbar">
  <span class="brand"><i class="bi bi-robot"></i> ROS2 Scanner</span>
  <div class="divider"></div>
  <select id="saved-select" onchange="loadSaved(this.value)" title="Saved connections"><option value="">Saved…</option></select>
  <input id="inp-host" placeholder="Robot IP" style="width:120px">
  <input id="inp-port" placeholder="22" value="22" type="number" style="width:52px">
  <input id="inp-user" placeholder="Username" style="width:88px">
  <input id="inp-pass" placeholder="Password" type="password" style="width:88px">
  <button class="btn btn-sm btn-danger" id="btn-connect" onclick="toggleConnect()">Connect</button>
  <div class="divider"></div>
  <div class="dot" id="dot"></div>
  <span id="status-text">Disconnected</span>
  <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
    <button id="danger-btn" onclick="toggleDangerMode()" title="DANGER MODE — arm to enable write commands">
      <i class="bi bi-shield-lock-fill"></i> SAFE
    </button>
    <button id="theme-btn" onclick="toggleTheme()" title="Toggle light/dark mode"
            style="background:none;border:1px solid var(--border);color:var(--muted);padding:2px 8px;border-radius:6px;cursor:pointer;font-size:.85rem;height:30px;transition:all .15s">
      <i class="bi bi-sun" id="theme-icon"></i>
    </button>
  </div>
</div>

<!-- ── Container bar ──────────────────────────────────────────────────────── -->
<div class="cbar" id="cbar">
  <div class="cbar-header">
    <i class="bi bi-box-seam" style="color:#818cf8"></i>
    <span class="cbar-label">Container:</span>
    <span class="cbar-selected-name" id="cbar-selected-name"></span>
    <button class="cbar-toggle" onclick="toggleCbar()"><i class="bi bi-chevron-up cbar-toggle-icon"></i></button>
  </div>
  <div class="cbar-body">
    <div id="container-list" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1;min-width:0"></div>
    <div class="cbar-controls">
      <button class="btn btn-sm btn-outline-secondary" id="btn-scan" onclick="scanContainers()" style="font-size:.75rem;padding:2px 10px;color:#aaa;border-color:#444"><i class="bi bi-arrow-clockwise"></i> Scan</button>
      <input id="inp-ros-path" placeholder="ROS path (auto)" title="Override e.g. /opt/ros/humble/setup.bash" style="width:190px">
    </div>
  </div>
</div>

<!-- ── Main shell ─────────────────────────────────────────────────────────── -->
<div class="shell" id="shell" style="height:calc(100vh - 50px)">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="stabs">
      <button class="stab active" id="stab-topics"   onclick="switchTab('topics')"><i class="bi bi-broadcast"></i> Topics <span class="badge" id="cnt-topics">0</span></button>
      <button class="stab"        id="stab-services" onclick="switchTab('services')"><i class="bi bi-gear"></i> Services <span class="badge" id="cnt-services">0</span></button>
      <button class="stab"        id="stab-actions"  onclick="switchTab('actions')"><i class="bi bi-lightning-charge"></i> Actions <span class="badge" id="cnt-actions">0</span></button>
    </div>
    <div class="sfilter"><input type="text" id="search" placeholder="Filter…" oninput="renderList(this.value.toLowerCase())"></div>
    <div class="slist" id="slist"></div>
    <div class="sfooter">
      <button class="btn btn-sm btn-outline-secondary w-100" id="btn-refresh" onclick="discover()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
      <button class="btn btn-sm btn-success w-100" id="btn-stream-selected" style="display:none" onclick="streamSelected()">
        <i class="bi bi-play-circle"></i> Stream <span id="stream-sel-cnt">0</span> selected
      </button>
    </div>
  </div>

  <!-- Detail pane -->
  <div class="detail" id="detail">
    <div class="empty"><i class="bi bi-robot"></i><h5>ROS2 Robot Scanner</h5><p>Connect via SSH, select a Docker container, then click any topic, service or action.</p></div>
  </div>

  <!-- Collapse strip -->
  <div class="detail-sep" id="detail-sep" onclick="toggleDetail()" title="Hide/show detail panel">
    <i class="bi bi-chevron-right" id="detail-sep-icon"></i>
  </div>

  <!-- Output panel -->
  <div class="output-panel" id="output-panel">
    <div class="output-resize-handle" id="output-resize-handle"></div>

    <div class="output-hdr">
      <div class="output-hdr-left">
        <i class="bi bi-circle-fill" id="output-dot" style="font-size:.5rem;color:#484f58;flex-shrink:0"></i>
        <div class="stream-chips" id="stream-chips">
          <span style="color:#484f58;font-size:.75rem;font-family:monospace">No active streams</span>
        </div>
        <span id="output-cnt"></span>
      </div>
      <!-- Text / Graph / pts -->
      <div class="ovt-wrap" id="output-view-toggle">
        <button class="ovt-btn active" id="ovt-text"  onclick="setOutputView('text')">Text</button>
        <button class="ovt-btn"        id="ovt-graph" onclick="setOutputView('graph')">Graph</button>
        <span id="chart-window-wrap" style="display:none;align-items:center;gap:3px">
          <span style="font-size:.69rem;color:var(--muted)">pts:</span>
          <input type="number" id="chart-window" value="400" min="20" max="9999"
                 style="width:56px;background:var(--dark3);border:1px solid var(--border);color:#c9d1d9;border-radius:4px;padding:1px 5px;font-size:.71rem;height:22px"
                 onchange="setChartWindow(+this.value)" title="Rolling window size">
        </span>
      </div>
      <div class="output-hdr-right">
        <!-- Views -->
        <select id="views-select" onchange="loadView(this.value)"
                style="background:var(--dark3);border:1px solid var(--border);color:var(--muted);border-radius:4px;font-size:.71rem;height:22px;padding:0 4px;max-width:90px">
          <option value="">Views…</option>
        </select>
        <button class="hdr-btn" onclick="saveCurrentView()" title="Save current view"><i class="bi bi-bookmark-plus"></i></button>
        <button class="hdr-btn" id="btn-stop-all" style="display:none" onclick="stopAllStreams()"><i class="bi bi-stop-circle"></i></button>
        <button class="hdr-btn" onclick="clearOutput()"><i class="bi bi-trash"></i></button>
      </div>
    </div>

    <!-- Text view -->
    <div class="output-body" id="output-body">
      <div class="output-placeholder"><i class="bi bi-graph-up" style="font-size:2rem;opacity:.25"></i><span>Start <b>Live Stream</b> on one or more topics</span></div>
    </div>

    <!-- Graph view: series panel (left) + canvas (right) -->
    <div class="output-graph-wrap" id="output-graph-wrap">
      <div class="series-panel" id="series-panel">
        <div class="series-panel-hdr">
          <span class="series-panel-title">SERIES</span>
          <button class="sg-btn" onclick="showAllSeries()" title="Show all">all</button>
          <button class="sg-btn" onclick="hideAllSeries()" title="Hide all">none</button>
        </div>
        <div class="series-panel-body" id="series-panel-body">
          <div style="padding:12px 8px;color:#484f58;font-size:.74rem;text-align:center">No data yet</div>
        </div>
      </div>
      <div class="graph-canvas-wrap"><canvas id="graph-canvas"></canvas></div>
    </div>
  </div>

</div>

<!-- ── Confirmation modal ──────────────────────────────────────────────────── -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-dialog">
    <div class="confirm-title">
      <i class="bi bi-exclamation-triangle-fill" style="color:#da3633;font-size:1.4rem"></i>
      <span style="color:#f85149;font-weight:700;font-size:1rem">Confirm command</span>
    </div>
    <p id="confirm-desc" style="color:#c9d1d9;margin-bottom:4px;font-size:.88rem"></p>
    <pre id="confirm-detail" class="confirm-pre"></pre>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-sm btn-outline-secondary" onclick="confirmAction(false)">Cancel</button>
      <button class="btn btn-sm btn-danger" onclick="confirmAction(true)">
        <i class="bi bi-send-fill"></i> Send command
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
const S = {
  connected:false, ready:false, outputView:'text',
  tab:'topics', data:{topics:[],services:[],actions:[]},
  selected:null, selectedContainer:null,
  streams:{},          // topic → {src, cnt, color}
  checkedTopics:new Set(),
  pendingHidden:null,  // Set of keys to hide on first sight (from config restore)
  _saveTimer:null,
};

const TOPIC_COLORS=['#3fb950','#58a6ff','#ffa657','#d2a8ff','#f85149','#79c0ff','#56d364','#ff7b72','#a5d6ff','#e3b341'];
const _topicColorMap={};
function topicColor(t){if(!_topicColorMap[t])_topicColorMap[t]=TOPIC_COLORS[Object.keys(_topicColorMap).length%TOPIC_COLORS.length];return _topicColorMap[t];}

/* ══════════════════════════════════════════════════════════
   SSH / CONNECTION
══════════════════════════════════════════════════════════ */
async function toggleConnect(){
  if(S.connected){await api('/api/disconnect','POST');setSSHState(false);return;}
  const host=v('inp-host'),port=v('inp-port')||'22',user=v('inp-user'),pass=v('inp-pass');
  if(!host||!user)return alert('Host and username required.');
  setBtn(true);setStatus('Connecting…');
  const r=await api('/api/connect','POST',{host,port:+port,username:user,password:pass});
  if(r.success){
    setSSHState(true,host);
    api('/api/credentials','POST',{host,port:+port,username:user,password:pass});
    loadSavedList(); scanContainers();
  }else{setStatus(`SSH error: ${r.error}`);setBtn(false);id('btn-connect').textContent='Connect';}
}

function setSSHState(ok,host=''){
  S.connected=ok;S.ready=false;
  id('dot').className=ok?'dot ssh':'dot';
  id('status-text').textContent=ok?`SSH: ${host}`:'Disconnected';
  id('status-text').style.color=ok?'#e6a817':'#8b949e';
  id('btn-connect').textContent=ok?'Disconnect':'Connect';
  id('btn-connect').className=ok?'btn btn-sm btn-outline-secondary':'btn btn-sm btn-danger';
  id('cbar').classList.toggle('visible',ok);
  if(!ok){
    id('container-list').innerHTML='';id('cbar-selected-name').textContent='';
    stopAllStreams(false);id('output-panel').classList.remove('visible');id('detail-sep').classList.remove('visible');
    S.data={topics:[],services:[],actions:[]};S.checkedTopics.clear();
    renderList();showEmpty();
  }
  adjustShellHeight();setBtn(false);
}
function setBtn(b){const btn=id('btn-connect');btn.disabled=b;if(b)btn.innerHTML='<span class="spin"></span>';}
function setStatus(m,c='#8b949e'){id('status-text').textContent=m;id('status-text').style.color=c;}
function adjustShellHeight(){
  requestAnimationFrame(()=>{
    const h=id('cbar').classList.contains('visible')?id('cbar').offsetHeight:0;
    id('shell').style.height=`calc(100vh - 50px - ${h}px)`;
  });
}
function toggleCbar(){id('cbar').classList.toggle('collapsed');adjustShellHeight();}

/* ══════════════════════════════════════════════════════════
   SAVED CREDENTIALS
══════════════════════════════════════════════════════════ */
async function loadSavedList(){
  const r=await api('/api/credentials');const sel=id('saved-select');
  sel.innerHTML='<option value="">Saved…</option>';
  (r.credentials||[]).forEach((c,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${c.username}@${c.host}`;sel.appendChild(o);});
  sel._data=r.credentials||[];
}
function loadSaved(idx){const c=id('saved-select')._data?.[idx];if(!c)return;id('inp-host').value=c.host;id('inp-port').value=c.port;id('inp-user').value=c.username;id('inp-pass').value=c.password;id('saved-select').value='';}

/* ══════════════════════════════════════════════════════════
   CONTAINERS
══════════════════════════════════════════════════════════ */
async function scanContainers(){
  const btn=id('btn-scan'),el=id('container-list');
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
  el.innerHTML='<span style="color:#8b949e;font-size:.78rem"><span class="spin"></span> Scanning…</span>';
  const r=await api('/api/containers');
  btn.disabled=false;btn.innerHTML='<i class="bi bi-arrow-clockwise"></i> Scan';
  if(r.error){el.innerHTML=`<span style="color:#f85149;font-size:.78rem">Error: ${esc(r.error)}</span>`;return;}
  const cs=r.containers||[];
  if(!cs.length){el.innerHTML='<span style="color:#8b949e;font-size:.78rem">No running containers</span>';return;}
  el.innerHTML='';let auto=null;
  cs.forEach(c=>{
    const isZ=c.name.toLowerCase().includes('zenoh'),hasRos=c.has_ros;
    const card=document.createElement('div');
    card.className='container-card'+(hasRos?'':' no-ros');card.dataset.id=c.id;card.dataset.name=c.name;
    card.innerHTML=`<i class="bi bi-${isZ?'broadcast':'box-seam'}" style="color:${isZ?'#818cf8':'#57606a'}"></i>
      <div><div class="cname">${esc(c.name)}</div><div class="cimage">${esc(c.image)}</div></div>
      ${hasRos?'<span class="ros-pill">ROS2</span>':''}${isZ?'<span class="zenoh-pill">Zenoh</span>':''}`;
    if(hasRos){card.onclick=()=>pickContainer(c.id,c.name);if(!auto||isZ)auto=c;}
    el.appendChild(card);
  });
  if(auto)pickContainer(auto.id,auto.name);adjustShellHeight();
}

async function pickContainer(cid,cname){
  document.querySelectorAll('.container-card').forEach(c=>c.classList.remove('selected'));
  const card=document.querySelector(`.container-card[data-id="${cid}"]`);if(card)card.classList.add('selected');
  setStatus(`Configuring ${cname}…`,'#e6a817');
  const r=await api('/api/container/select','POST',{container_id:cid,ros_path:v('inp-ros-path')||null});
  if(r.error){setStatus(`Container error: ${r.error}`,'#f85149');return;}
  S.ready=true;S.selectedContainer={id:cid,name:cname};id('cbar-selected-name').textContent=cname;
  id('dot').className='dot ok';
  setStatus(`${r.container_name}${r.ros_distro?` · ROS2 ${r.ros_distro}`:''}${r.middleware?` · ${r.middleware}`:''}`, '#3fb950');
  id('output-panel').classList.add('visible');id('detail-sep').classList.add('visible');
  await discover();
  restoreLastSession();
}

/* ══════════════════════════════════════════════════════════
   ROS2 DISCOVERY
══════════════════════════════════════════════════════════ */
async function discover(){
  if(!S.ready)return;
  const btn=id('btn-refresh');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Scanning…';
  const r=await api('/api/discover');
  if(!r.error){S.data=r;id('cnt-topics').textContent=r.topics.length;id('cnt-services').textContent=r.services.length;id('cnt-actions').textContent=r.actions.length;renderList();}
  btn.disabled=false;btn.innerHTML='<i class="bi bi-arrow-clockwise"></i> Refresh';
}

/* ══════════════════════════════════════════════════════════
   TABS + LIST
══════════════════════════════════════════════════════════ */
function switchTab(tab){
  S.tab=tab;S.selected=null;
  document.querySelectorAll('.stab').forEach(t=>t.classList.remove('active'));
  id('stab-'+tab).classList.add('active');id('search').value='';renderList();showEmpty();
}

function renderList(filter=''){
  const items=S.data[S.tab]||[],el=id('slist');
  const vis=filter?items.filter(i=>i.includes(filter)):items;
  if(!vis.length){el.innerHTML=`<div style="padding:20px;text-align:center;color:#484f58;font-size:.78rem">${S.ready?'Nothing found':'Connect + select container first'}</div>`;return;}
  el.innerHTML='';
  vis.forEach(name=>{
    const d=document.createElement('div');
    if(S.tab==='topics'){
      const streaming=name in S.streams, checked=S.checkedTopics.has(name);
      d.className='sitem'+(name===S.selected?' active':'');
      const dotClass=streaming?'is-streaming':checked?'is-checked':'';
      const dotIcon=streaming?'<i class="bi bi-broadcast-pin" style="font-size:.72rem"></i>':checked?'<i class="bi bi-check-circle-fill" style="font-size:.72rem"></i>':'<i class="bi bi-circle" style="font-size:.72rem"></i>';
      d.innerHTML=`<span class="sitem-check ${dotClass}" onclick='event.stopPropagation();toggleTopicCheck(${q(name)})' title="${streaming?'Stop stream':checked?'Deselect':'Select'}">${dotIcon}</span><span class="sitem-label" title="${esc(name)}">${esc(name)}</span>`;
      d.querySelector('.sitem-label').onclick=()=>select(name);
    }else{
      d.className='sitem'+(name===S.selected?' active':'');
      d.innerHTML=`<span class="sitem-label sitem-plain" title="${esc(name)}">${esc(name)}</span>`;
      d.onclick=()=>select(name);
    }
    el.appendChild(d);
  });
}

function toggleTopicCheck(topic){
  if(topic in S.streams){stopSingleStream(topic);return;}
  if(S.checkedTopics.has(topic))S.checkedTopics.delete(topic);else S.checkedTopics.add(topic);
  renderList(id('search').value.toLowerCase());
  const n=S.checkedTopics.size;
  id('btn-stream-selected').style.display=n?'block':'none';
  id('stream-sel-cnt').textContent=n;
}

function streamSelected(){
  S.checkedTopics.forEach(t=>startStream(t));
  S.checkedTopics.clear();
  id('btn-stream-selected').style.display='none';
  renderList(id('search').value.toLowerCase());
}

function select(name){
  S.selected=name;renderList(id('search').value.toLowerCase());
  if(S.tab==='topics')showTopic(name);
  else if(S.tab==='services')showService(name);
  else showAction(name);
}

/* ══════════════════════════════════════════════════════════
   DETAIL COLLAPSE
══════════════════════════════════════════════════════════ */
function toggleDetail(){
  const d=id('detail'), panel=id('output-panel');
  const hidden=d.classList.toggle('hidden');
  id('detail-sep-icon').className=`bi bi-chevron-${hidden?'right':'left'}`;
  if(hidden){
    // Save current width then let the panel stretch to fill the vacated space
    panel.dataset.w=panel.style.width;
    panel.style.width='';
    panel.style.flexGrow='1';
  }else{
    panel.style.flexGrow='';
    if(panel.dataset.w)panel.style.width=panel.dataset.w;
  }
  if(G.chart&&S.outputView==='graph')requestAnimationFrame(()=>G.chart.resize());
}

/* ══════════════════════════════════════════════════════════
   CARD HELPERS
══════════════════════════════════════════════════════════ */
function toggleCard(hdr){hdr.closest('.icard').classList.toggle('collapsed');}
function cardHdr(icon,label){
  return `<div class="icard-hdr" onclick="toggleCard(this)"><span class="icard-hdr-left"><i class="bi bi-${icon}"></i> ${label}</span><i class="bi bi-chevron-up icard-chevron"></i></div>`;
}

/* ══════════════════════════════════════════════════════════
   TOPIC DETAIL
══════════════════════════════════════════════════════════ */
async function showTopic(topic){
  setDetail(`<div class="d-flex align-items-center gap-2 mb-3">
    <i class="bi bi-broadcast" style="color:#e94560;font-size:1.3rem"></i>
    <h5 class="mb-0" style="font-family:monospace">${esc(topic)}</h5>
    <span class="spin" id="topic-spinner"></span>
  </div><div id="topic-body"></div>`);
  const info=await api('/api/topic/info','POST',{topic});
  const sp=id('topic-spinner');if(sp)sp.remove();
  const isStreaming=topic in S.streams;
  id('topic-body').innerHTML=`
    <div class="icard">${cardHdr('info-circle','Info')}
      <div class="icard-body">
        <div class="info-row"><span class="info-label">Type</span><span class="type-pill">${esc(info.type||'—')}</span></div>
        <div class="info-row"><span class="info-label">Publishers</span><span class="badge bg-primary">${info.publisher_count}</span></div>
        <div class="info-row"><span class="info-label">Subscribers</span><span class="badge bg-secondary">${info.subscriber_count}</span></div>
        <div class="action-row">
          <button class="btn btn-sm btn-outline-secondary" onclick='echoOnce(${q(topic)})'><i class="bi bi-eye"></i> Echo Once</button>
          <button class="btn btn-sm ${isStreaming?'btn-danger':'btn-success'}" onclick='${isStreaming?"stopSingleStream("+q(topic)+")":"startStream("+q(topic)+")"}'>
            <i class="bi bi-${isStreaming?'stop-circle':'play-circle'}"></i> ${isStreaming?'Stop Stream':'Live Stream'}
          </button>
        </div>
      </div>
    </div>
    <div class="icard collapsed">${cardHdr('send','Publish')}
      <div class="icard-body">
        <div class="mb-2"><label class="form-label" style="font-size:.79rem;color:#57606a">Message type</label>
          <input class="form-control form-control-sm" id="pub-type" value="${esc(info.type||'')}" placeholder="std_msgs/msg/String"></div>
        <div class="mb-2"><label class="form-label" style="font-size:.79rem;color:#57606a">Data (YAML)</label>
          <textarea class="form-control" id="pub-data" rows="3">{data: hello}</textarea></div>
        <button class="btn btn-sm btn-primary" onclick='publishTopic(${q(topic)})'><i class="bi bi-send"></i> Publish</button>
        <div id="pub-result" class="mt-2"></div>
      </div>
    </div>`;
  fillProto(info.type,'pub-data');
}

async function echoOnce(topic){
  try{
    id('output-panel').classList.add('visible');id('detail-sep').classList.add('visible');
    setOutputView('text');
    id('output-body').innerHTML='<div style="padding:8px;color:#8b949e;font-size:.75rem"><span class="spin"></span> Waiting…</div>';
    const r=await api('/api/topic/echo_once','POST',{topic});
    id('output-body').innerHTML=`<div class="emsg">${esc(r.data||r.error||'(no data)')}</div>`;
  }catch(e){id('output-body').innerHTML=`<div class="emsg" style="color:#f85149">Error: ${esc(String(e))}</div>`;}
}
async function publishTopic(topic){
  const type=v('pub-type'), data=v('pub-data');
  if (!await requireConfirm(`Publish to  ${topic}`, `Type: ${type}\n\n${data}`)) return;
  const el=id('pub-result');el.innerHTML='<span class="spin"></span> Publishing…';
  const r=await api('/api/topic/publish','POST',{topic,type,data});
  el.innerHTML=`<div class="code-block">${esc(r.output||r.error||'Done')}</div>`;
}

/* ══════════════════════════════════════════════════════════
   SERVICE + ACTION DETAIL
══════════════════════════════════════════════════════════ */
async function showService(service){
  setDetail(`<div class="d-flex align-items-center gap-2 mb-3"><i class="bi bi-gear" style="color:#0d6efd;font-size:1.3rem"></i><h5 class="mb-0" style="font-family:monospace">${esc(service)}</h5><span class="spin" id="topic-spinner"></span></div><div id="srv-body"></div>`);
  const r=await api('/api/service/type','POST',{service});
  const sp=id('topic-spinner');if(sp)sp.remove();
  id('srv-body').innerHTML=`
    <div class="icard">${cardHdr('info-circle','Info')}<div class="icard-body"><div class="info-row"><span class="info-label">Type</span><span class="type-pill">${esc(r.type||'—')}</span></div></div></div>
    <div class="icard">${cardHdr('terminal','Call Service')}
      <div class="icard-body">
        <div class="mb-2"><label class="form-label" style="font-size:.79rem;color:#57606a">Service type</label><input class="form-control form-control-sm" id="srv-type" value="${esc(r.type||'')}" placeholder="std_srvs/srv/SetBool"></div>
        <div class="mb-2"><label class="form-label" style="font-size:.79rem;color:#57606a">Request (YAML)</label><textarea class="form-control" id="srv-data" rows="3">{}</textarea></div>
        <button class="btn btn-sm btn-primary" onclick='callService(${q(service)})'><i class="bi bi-play-circle"></i> Call</button>
        <div id="srv-result" class="mt-2"></div>
      </div>
    </div>`;
  fillProto(r.type,'srv-data');
}
async function callService(service){
  const type=v('srv-type'), data=v('srv-data');
  if (!await requireConfirm(`Call service  ${service}`, `Type: ${type}\n\n${data}`)) return;
  const el=id('srv-result');el.innerHTML='<span class="spin"></span> Calling…';
  const r=await api('/api/service/call','POST',{service,type,data});
  el.innerHTML=`<div class="code-block">${esc(r.output||r.error||'Done')}</div>`;
}

async function showAction(action){
  setDetail(`<div class="d-flex align-items-center gap-2 mb-3"><i class="bi bi-lightning-charge" style="color:#fd7e14;font-size:1.3rem"></i><h5 class="mb-0" style="font-family:monospace">${esc(action)}</h5><span class="spin" id="topic-spinner"></span></div><div id="act-body"></div>`);
  const info=await api('/api/action/info','POST',{action});
  const sp=id('topic-spinner');if(sp)sp.remove();
  id('act-body').innerHTML=`
    <div class="icard">${cardHdr('info-circle','Info')}<div class="icard-body"><div class="info-row"><span class="info-label">Type</span><span class="type-pill">${esc(info.type||'—')}</span></div>${info.raw?`<div class="code-block mt-2" style="max-height:150px">${esc(info.raw.trim())}</div>`:''}</div></div>
    <div class="icard">${cardHdr('play-circle','Send Goal')}
      <div class="icard-body">
        <div class="mb-2"><label class="form-label" style="font-size:.79rem;color:#57606a">Action type</label><input class="form-control form-control-sm" id="act-type" value="${esc(info.type||'')}" placeholder="nav2_msgs/action/NavigateToPose"></div>
        <div class="mb-2"><label class="form-label" style="font-size:.79rem;color:#57606a">Goal (YAML)</label><textarea class="form-control" id="act-goal" rows="4" placeholder="{}"></textarea></div>
        <button class="btn btn-sm btn-warning" onclick='sendGoal(${q(action)})'><i class="bi bi-send"></i> Send Goal</button>
        <div id="act-result" class="mt-2"></div>
      </div>
    </div>`;
  fillProto(info.type,'act-goal');
}
async function sendGoal(action){
  const type=v('act-type'), goal=v('act-goal')||'{}';
  if (!await requireConfirm(`Send goal to  ${action}`, `Type: ${type}\n\n${goal}`)) return;
  const el=id('act-result');el.innerHTML='<span class="spin"></span> Sending…';
  const r=await api('/api/action/send_goal','POST',{action,type,goal});
  el.innerHTML=`<div class="code-block">${esc(r.output||r.error||'Done')}</div>`;
}
async function fillProto(type,targetId){
  if(!type)return;
  const r=await api('/api/interface/proto','POST',{type});
  const el=id(targetId);if(!el||!r.proto||r.error)return;
  // Actions and services return goal/request + --- + result/response + --- + feedback
  // We only want the first section; strip comment lines then trim
  const first=r.proto.split(/\n---/)[0];
  el.value=first.replace(/^\s*#.*\n?/mg,'').trim()||'{}';
}

/* ══════════════════════════════════════════════════════════
   MULTI-TOPIC STREAMING
══════════════════════════════════════════════════════════ */
function startStream(topic){
  if(topic in S.streams){stopSingleStream(topic);return;}
  const color=topicColor(topic);
  S.streams[topic]={src:null,cnt:0,color};
  id('output-panel').classList.add('visible');id('detail-sep').classList.add('visible');
  if(!id('output-body').querySelector('.smsg'))id('output-body').innerHTML='';

  const src=new EventSource(`/api/topic/stream?topic=${encodeURIComponent(topic)}`);
  S.streams[topic].src=src;
  src.onmessage=(e)=>{
    if(!S.streams[topic])return;
    try{
      const msg=JSON.parse(e.data);
      if(msg.error){appendText(`<span style="color:#f85149">[${esc(topic)}] ${esc(msg.error)}</span>`);stopSingleStream(topic,false);return;}
      S.streams[topic].cnt++;updateStreamHeader();
      appendText(`<div class="smsg"><span style="color:${esc(color)};opacity:.7;font-size:.65rem">${esc(topic)}</span>\n${esc(msg.message)}</div>`);trimText();
      feedChart(msg.message,topic);
    }catch(_){}
  };
  src.onerror=()=>{appendText(`<span style="color:#484f58;font-size:.72rem">[${esc(topic)}] stream ended.</span>`);stopSingleStream(topic,false);};

  renderStreamChips();
  if(S.selected===topic&&S.tab==='topics')showTopic(topic);
  scheduleConfigSave();
}

function stopSingleStream(topic,refresh=true){
  const s=S.streams[topic];if(!s)return;
  s.src.close();delete S.streams[topic];
  renderStreamChips();updateStreamHeader();
  if(refresh&&S.selected===topic&&S.tab==='topics')showTopic(topic);
  if(S.tab==='topics')renderList(id('search').value.toLowerCase());
  scheduleConfigSave();
}
function stopAllStreams(refresh=true){Object.keys(S.streams).forEach(t=>stopSingleStream(t,refresh));}

function updateStreamHeader(){
  const topics=Object.keys(S.streams);const total=Object.values(S.streams).reduce((a,s)=>a+s.cnt,0);
  id('output-dot').style.color=topics.length?'#3fb950':'#484f58';
  id('output-cnt').textContent=topics.length?`${total} msgs`:'';
  id('btn-stop-all').style.display=topics.length?'inline-block':'none';
}
function renderStreamChips(){
  const el=id('stream-chips');const topics=Object.keys(S.streams);
  if(!topics.length){el.innerHTML='<span style="color:#484f58;font-size:.75rem;font-family:monospace">No active streams</span>';return;}
  el.innerHTML=topics.map(t=>`<span class="stream-chip" style="border-color:${esc(S.streams[t].color)}30;background:${esc(S.streams[t].color)}18">
    <span class="chip-dot" style="background:${esc(S.streams[t].color)}"></span>
    <span style="font-family:monospace;font-size:.7rem;max-width:140px;overflow:hidden;text-overflow:ellipsis">${esc(t)}</span>
    <span class="chip-x" onclick='stopSingleStream(${q(t)})'>×</span>
  </span>`).join('');
}
function appendText(html){const b=id('output-body');b.insertAdjacentHTML('beforeend',html);b.scrollTop=b.scrollHeight;}
function trimText(){const msgs=id('output-body').querySelectorAll('.smsg');if(msgs.length>400)msgs[0].remove();}

function clearOutput(){
  stopAllStreams(false);resetChart();
  id('output-view-toggle').style.display='none';setOutputView('text');
  id('output-body').innerHTML=`<div class="output-placeholder"><i class="bi bi-graph-up" style="font-size:2rem;opacity:.25"></i><span>Start <b>Live Stream</b> on one or more topics</span></div>`;
  updateStreamHeader();renderStreamChips();
}

function setOutputView(view){
  S.outputView=view;const g=view==='graph';
  id('output-body').style.display=g?'none':'';
  id('output-graph-wrap').style.display=g?'flex':'none';
  id('ovt-text').classList.toggle('active',!g);
  id('ovt-graph').classList.toggle('active',g);
  const ww=id('chart-window-wrap');if(ww)ww.style.display=g?'flex':'none';
  if(g&&G.chart)requestAnimationFrame(()=>G.chart.resize());
}

/* ══════════════════════════════════════════════════════════
   TIME-SERIES CHART
══════════════════════════════════════════════════════════ */
const PALETTE=['#3fb950','#58a6ff','#ffa657','#d2a8ff','#f85149','#79c0ff','#56d364','#ff7b72','#a5d6ff','#e3b341','#bc8cff','#54aeff','#ffb647','#7ee787','#ff6e6e'];
const G={chart:null,keys:[],colors:{},hidden:{},bufs:{},labels:[],lastVal:{},MAX:400,dirty:false,_panelTimer:0};

function applyNameMapping(obj){
  if(!obj||typeof obj!=='object'||Array.isArray(obj))return obj;
  const r={};
  for(const[k,v]of Object.entries(obj))r[k]=(v&&typeof v==='object'&&!Array.isArray(v))?applyNameMapping(v):v;
  const names=r.name;
  if(!Array.isArray(names)||!names.length||!names.every(n=>typeof n==='string'))return r;
  for(const[k,v]of Object.entries(r)){
    if(k==='name')continue;
    if(Array.isArray(v)&&v.length===names.length){const named={};names.forEach((n,i)=>{named[n]=v[i];});r[k]=named;}
  }
  return r;
}

function flattenNumeric(obj,prefix){
  prefix=prefix||'';const out={};
  if(typeof obj!=='object'||obj===null)return out;
  if(Array.isArray(obj)){
    obj.forEach((v,i)=>{const k=prefix?`${prefix}[${i}]`:`[${i}]`;
      if(typeof v==='number'&&isFinite(v))out[k]=v;
      else if(typeof v==='object'&&v!==null)Object.assign(out,flattenNumeric(v,k));});
  }else{
    Object.entries(obj).forEach(([k,v])=>{const p=prefix?`${prefix}.${k}`:k;
      if(typeof v==='number'&&isFinite(v))out[p]=v;
      else if(typeof v==='object'&&v!==null)Object.assign(out,flattenNumeric(v,p));});
  }
  return out;
}

function resetChart(){
  if(G.chart){G.chart.destroy();G.chart=null;}
  G.keys=[];G.colors={};G.hidden={};G.bufs={};G.labels=[];G.lastVal={};G.dirty=false;
  id('series-panel-body').innerHTML='<div style="padding:12px 8px;color:#484f58;font-size:.74rem;text-align:center">No data yet</div>';
}

function chartTheme(){
  const light=document.body.dataset.theme==='light';
  return {gc:light?'#d0d7de':'#21262d', tc:light?'#57606a':'#8b949e', bc:light?'#d0d7de':'#30363d',
          tbg:light?'#ffffff':'#161b22', tbr:light?'#d0d7de':'#30363d',
          ttl:light?'#57606a':'#8b949e', tbd:light?'#24292f':'#c9d1d9'};
}

function initChart(){
  const ctx=id('graph-canvas').getContext('2d');
  const{gc,tc,bc,tbg,tbr,ttl,tbd}=chartTheme();
  G.chart=new Chart(ctx,{
    type:'line',data:{labels:G.labels,datasets:[]},
    options:{
      animation:false,responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:tbg,borderColor:tbr,borderWidth:1,
          titleColor:ttl,bodyColor:tbd,padding:8,
          filter:item=>item.parsed.y!==null,
          callbacks:{
            title:items=>`msg #${items[0].parsed.x}`,
            label:ctx=>{const v=ctx.parsed.y;if(v===null)return null;const s=Math.abs(v)>=1e4||(Math.abs(v)<0.01&&v!==0)?v.toExponential(3):+v.toPrecision(6);return ` ${ctx.dataset.label}: ${s}`;},
          },
        },
      },
      scales:{
        x:{type:'linear',ticks:{color:tc,maxTicksLimit:8,font:{size:10}},grid:{color:gc},border:{color:bc}},
        y:{ticks:{color:tc,font:{size:10}},grid:{color:gc},border:{color:bc},},
      },
    },
  });
}

function scheduleChartUpdate(){
  if(G.dirty||!G.chart)return;G.dirty=true;
  requestAnimationFrame(()=>{if(G.chart){G.chart.data.labels=G.labels;G.chart.update('none');}G.dirty=false;});
}

function scheduleSeriesPanelUpdate(){
  // Throttle to ~4fps to avoid hammering the DOM
  const now=performance.now();
  if(now-G._panelTimer<250)return;
  G._panelTimer=now;
  requestAnimationFrame(renderSeriesPanel);
}

function feedChart(msgText,topic){
  if(!window.jsyaml)return;
  let obj;try{obj=jsyaml.load(msgText);}catch(e){return;}
  const flat=flattenNumeric(applyNameMapping(obj));
  if(!Object.keys(flat).length)return;
  if(!G.chart)initChart();

  // Show Text/Graph toggle once we have chartable data
  const tog=id('output-view-toggle');if(!tog.style.display||tog.style.display==='none')tog.style.display='flex';

  const prefix=topic.replace(/^\//,'')+'::';

  const x=G.labels.length?G.labels[G.labels.length-1]+1:0;
  G.labels.push(x);if(G.labels.length>G.MAX)G.labels.shift();

  let newKeys=false;
  for(const[field,val]of Object.entries(flat)){
    const key=prefix+field;
    if(!(key in G.bufs)){
      G.keys.push(key);
      const color=PALETTE[(G.keys.length-1)%PALETTE.length];
      G.colors[key]=color;
      // Pending hidden from config restore overrides auto-hide
      const autoHide=(S.pendingHidden&&S.pendingHidden.has(key))||(val>1e8||key.includes('nanosec')||/(?:^|\.)sec$/.test(field));
      G.hidden[key]=autoHide;
      G.bufs[key]=new Array(Math.max(0,G.labels.length-1)).fill(null);
      G.chart.data.datasets.push({label:key,data:G.bufs[key],borderColor:color,backgroundColor:'transparent',borderWidth:1.5,pointRadius:0,pointHoverRadius:3,tension:0,hidden:autoHide,spanGaps:false});
      newKeys=true;
    }
    G.bufs[key].push(val);if(G.bufs[key].length>G.MAX)G.bufs[key].shift();
    G.lastVal[key]=val;
  }
  const updated=new Set(Object.keys(flat).map(f=>prefix+f));
  for(const key of G.keys){if(!updated.has(key)){G.bufs[key].push(null);if(G.bufs[key].length>G.MAX)G.bufs[key].shift();}}

  scheduleChartUpdate();
  if(newKeys)renderSeriesPanel();else scheduleSeriesPanelUpdate();
}

/* ── Series panel ── */
function fieldLabel(key){
  // "topicname::field.path" → display as "field.path"
  const sep=key.indexOf('::');return sep>=0?key.slice(sep+2):key;
}
function topicFromKey(key){const sep=key.indexOf('::');return sep>=0?key.slice(0,sep):'';}

function fmtVal(v){
  if(v===undefined||v===null)return '—';
  if(!isFinite(v))return String(v);
  return Math.abs(v)>=1e4||(Math.abs(v)<0.01&&v!==0)?v.toExponential(2):(+v.toPrecision(4)).toString();
}

function renderSeriesPanel(){
  // Group by topic
  const byTopic={};
  for(const key of G.keys){
    const t=topicFromKey(key);
    if(!byTopic[t])byTopic[t]=[];
    byTopic[t].push(key);
  }
  let html='';
  for(const[topic,keys]of Object.entries(byTopic)){
    html+=`<div class="series-group">
      <div class="series-group-hdr">
        <span class="series-group-topic">${esc(topic||'?')}</span>
        <div class="series-group-btns">
          <button class="sg-btn" onclick='showAllSeries(${q(topic)})' title="Show all in group">all</button>
          <button class="sg-btn" onclick='hideAllSeries(${q(topic)})' title="Hide all in group">none</button>
        </div>
      </div>`;
    for(const key of keys){
      const i=G.keys.indexOf(key);
      const field=fieldLabel(key);
      const val=fmtVal(G.lastVal[key]);
      const hidden=G.hidden[key];
      html+=`<div class="series-row${hidden?' faded':''}" onclick="toggleSeries(${i})" title="${esc(key)}">
        <span class="series-dot" style="background:${G.colors[key]}"></span>
        <span class="series-name">${esc(field.length>24?'…'+field.slice(-22):field)}</span>
        <span class="series-val">${esc(val)}</span>
      </div>`;
    }
    html+='</div>';
  }
  id('series-panel-body').innerHTML=html||'<div style="padding:12px 8px;color:#484f58;font-size:.74rem;text-align:center">No data yet</div>';
}

function toggleSeries(i){
  const key=G.keys[i];if(!key)return;
  G.hidden[key]=!G.hidden[key];
  G.chart.data.datasets[i].hidden=G.hidden[key];
  G.chart.update('none');renderSeriesPanel();
  scheduleConfigSave();
}
function showAllSeries(topic){
  G.keys.forEach((k,i)=>{if(!topic||topicFromKey(k)===topic){G.hidden[k]=false;G.chart.data.datasets[i].hidden=false;}});
  G.chart.update('none');renderSeriesPanel();scheduleConfigSave();
}
function hideAllSeries(topic){
  G.keys.forEach((k,i)=>{if(!topic||topicFromKey(k)===topic){G.hidden[k]=true;G.chart.data.datasets[i].hidden=true;}});
  G.chart.update('none');renderSeriesPanel();scheduleConfigSave();
}

function setChartWindow(n){
  n=Math.max(20,Math.min(9999,n||400));id('chart-window').value=n;
  if(n===G.MAX)return;G.MAX=n;if(!G.chart)return;
  if(G.labels.length>n){const trim=G.labels.length-n;G.labels.splice(0,trim);for(const k of G.keys)G.bufs[k].splice(0,trim);}
  G.chart.data.labels=G.labels;G.chart.update('none');scheduleConfigSave();
}

/* ══════════════════════════════════════════════════════════
   CONFIG / VIEWS
══════════════════════════════════════════════════════════ */
// In-memory copy of saved views — avoids GET/POST races
let _savedViews = [];

function _hiddenSeriesList() {
  // Include keys already processed AND any pendingHidden not yet seen
  const hs = G.keys.filter(k => G.hidden[k]);
  if (S.pendingHidden) S.pendingHidden.forEach(k => { if (!hs.includes(k)) hs.push(k); });
  return hs;
}

function scheduleConfigSave() {
  clearTimeout(S._saveTimer);
  S._saveTimer = setTimeout(saveConfig, 1200);
}

async function saveConfig() {
  await api('/api/config', 'POST', {
    last_session: {
      streaming_topics: Object.keys(S.streams),
      hidden_series: _hiddenSeriesList(),
      chart_window: G.MAX,
      output_width: parseInt(id('output-panel').style.width) || 520,
    },
    saved_views: _savedViews,
  });
}

async function restoreLastSession() {
  const cfg = await api('/api/config');
  _savedViews = cfg.saved_views || [];
  refreshViewsDropdown();
  if (!cfg.last_session) return;
  const ls = cfg.last_session;
  if (ls.output_width) id('output-panel').style.width = ls.output_width + 'px';
  if (ls.chart_window) setChartWindow(ls.chart_window);
  if (ls.hidden_series && ls.hidden_series.length) S.pendingHidden = new Set(ls.hidden_series);
  for (const t of (ls.streaming_topics || [])) { if (S.data.topics.includes(t)) startStream(t); }
}

async function loadViewsList() {
  const cfg = await api('/api/config');
  _savedViews = cfg.saved_views || [];
  refreshViewsDropdown();
}

function refreshViewsDropdown() {
  const sel = id('views-select');
  sel.innerHTML = '<option value="">Views…</option>';
  _savedViews.forEach((v, i) => {
    const o = document.createElement('option'); o.value = i; o.textContent = v.name; sel.appendChild(o);
  });
}

async function saveCurrentView() {
  const name = prompt('Name this view:'); if (!name || !name.trim()) return;
  const view = {
    name: name.trim(),
    streaming_topics: Object.keys(S.streams),
    hidden_series: _hiddenSeriesList(),
    chart_window: G.MAX,
  };
  const idx = _savedViews.findIndex(v => v.name === view.name);
  if (idx >= 0) _savedViews[idx] = view; else _savedViews.push(view);
  await saveConfig();
  refreshViewsDropdown();
}

function loadView(idx) {
  const view = _savedViews[parseInt(idx)]; if (!view) return;
  id('views-select').value = '';
  stopAllStreams(false); resetChart();
  if (view.chart_window) setChartWindow(view.chart_window);
  // Set pending hidden BEFORE startStream so first feedChart pass uses them
  S.pendingHidden = (view.hidden_series && view.hidden_series.length) ? new Set(view.hidden_series) : null;
  for (const t of (view.streaming_topics || [])) { if (S.data.topics.includes(t)) startStream(t); }
}

/* ══════════════════════════════════════════════════════════
   OUTPUT PANEL RESIZE (left edge drag)
══════════════════════════════════════════════════════════ */
(function(){
  let drag=false,sx=0,sw=0;
  const handle=id('output-resize-handle'),panel=id('output-panel');
  handle.addEventListener('mousedown',e=>{
    if(id('detail').classList.contains('hidden'))return; // panel fills shell — no resize needed
    drag=true;sx=e.clientX;sw=panel.offsetWidth;document.body.style.cursor='ew-resize';document.body.style.userSelect='none';e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{if(!drag)return;const nw=Math.max(260,Math.min(window.innerWidth*.85,sw+(sx-e.clientX)));panel.style.width=nw+'px';if(G.chart&&S.outputView==='graph')G.chart.resize();});
  document.addEventListener('mouseup',()=>{if(!drag)return;drag=false;document.body.style.cursor='';document.body.style.userSelect='';});
})();

function showEmpty(){const icons={topics:'broadcast',services:'gear',actions:'lightning-charge'};setDetail(`<div class="empty"><i class="bi bi-${icons[S.tab]}"></i><h5>Select a ${S.tab.slice(0,-1)}</h5><p>Click an item in the sidebar to inspect and interact with it.</p></div>`);}
function setDetail(html){id('detail').innerHTML=html;}
function id(x){return document.getElementById(x);}
function v(x){const e=id(x);return e?e.value.trim():'';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function q(s){return JSON.stringify(s);}
async function api(url,method='GET',body=null){
  const opts={method,headers:{}};
  if(body){opts.body=JSON.stringify(body);opts.headers['Content-Type']='application/json';}
  try{return(await fetch(url,opts)).json();}catch(e){return{error:e.message};}
}

/* ══════════════════════════════════════════════════════════
   DANGER MODE + CONFIRMATION
══════════════════════════════════════════════════════════ */
S.dangerMode = false;
let _confirmResolve = null;

function toggleDangerMode() {
  S.dangerMode = !S.dangerMode;
  const btn = id('danger-btn');
  if (S.dangerMode) {
    btn.classList.add('armed');
    btn.innerHTML = '<i class="bi bi-shield-fill-exclamation"></i> DANGER';
  } else {
    btn.classList.remove('armed');
    btn.innerHTML = '<i class="bi bi-shield-lock-fill"></i> SAFE';
  }
}

/* Returns a Promise<bool> — resolves true if user confirms, false if cancelled.
   If danger mode is off, alerts immediately and resolves false. */
function requireConfirm(description, detail) {
  if (!S.dangerMode) {
    // Show a brief shake on the button instead of a blocking alert
    const btn = id('danger-btn');
    btn.style.animation = 'none';
    btn.style.borderColor = '#da3633';
    btn.style.color = '#da3633';
    setTimeout(() => { btn.style.borderColor = ''; btn.style.color = ''; }, 1200);
    id('confirm-overlay').style.display = 'flex';
    id('confirm-desc').textContent = 'DANGER MODE is not armed. Enable it first to send commands.';
    id('confirm-detail').textContent = '';
    // In "safe" mode the modal just shows a warning — no send button
    // We'll hide the send button
    id('confirm-overlay').querySelector('.btn-danger').style.display = 'none';
    return new Promise(resolve => { _confirmResolve = () => resolve(false); });
  }
  id('confirm-overlay').querySelector('.btn-danger').style.display = '';
  id('confirm-desc').textContent = description;
  id('confirm-detail').textContent = detail;
  id('confirm-overlay').style.display = 'flex';
  return new Promise(resolve => { _confirmResolve = resolve; });
}

function confirmAction(ok) {
  id('confirm-overlay').style.display = 'none';
  if (_confirmResolve) { _confirmResolve(ok); _confirmResolve = null; }
}

// Close on backdrop click
id('confirm-overlay').addEventListener('click', e => {
  if (e.target === id('confirm-overlay')) confirmAction(false);
});

/* ══════════════════════════════════════════════════════════
   THEME TOGGLE
══════════════════════════════════════════════════════════ */
function rebuildChart(){
  if(!G.chart)return;
  const datasets=G.chart.data.datasets.map(d=>({...d}));
  G.chart.destroy();G.chart=null;
  initChart();
  datasets.forEach(d=>G.chart.data.datasets.push(d));
  G.chart.data.labels=G.labels;
  G.chart.update('none');
}

function toggleTheme(){
  const light=document.body.dataset.theme!=='light';
  document.body.dataset.theme=light?'light':'dark';
  id('theme-icon').className=`bi bi-${light?'moon-stars':'sun'}`;
  localStorage.setItem('ros2-theme',light?'light':'dark');
  rebuildChart();
}

// Apply saved theme on load
(function(){
  const t=localStorage.getItem('ros2-theme')||'dark';
  document.body.dataset.theme=t;
  const icon=id('theme-icon');if(icon)icon.className=`bi bi-${t==='light'?'moon-stars':'sun'}`;
})();

document.getElementById('inp-host').addEventListener('keydown',e=>{if(e.key==='Enter')toggleConnect();});
loadSavedList();loadViewsList();
